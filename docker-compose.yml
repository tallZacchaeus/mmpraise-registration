# MMPraise Volunteer Registration — production stack for a single VPS.
#
#   cp .env.example .env.production   # then fill it in — see docs/GO-LIVE.md
#   docker compose --env-file .env.production build
#   docker compose --env-file .env.production up -d
#
# `--env-file` is not optional. Compose substitutes ${VAR} from `.env` by
# default, so without it every NEXT_PUBLIC_* build argument below resolves to an
# empty string and the browser bundle ships with no site URL and every feature
# flag at its default.
#
# PostgreSQL runs on this same box as the `db` service (decision 2026-08-05),
# with its data in the `pgdata` volume. DATABASE_URL in .env.production must be
#   postgresql://mmp:${POSTGRES_PASSWORD}@db:5432/mmp_registration
# Backups are your responsibility — the pg_dump recipe is in
# docs/DEPLOYMENT.md, and it should run from cron on the host from day one.

services:
  # One-shot: applies any migrations that are not yet in the database, then
  # exits. `app` will not start until this succeeds, so the server never runs
  # against a schema the code does not match. `migrate deploy` only replays
  # migrations that are already reviewed and committed — it never generates or
  # resets anything, so it is safe on every boot.
  #
  # Seed the database once, after the first deploy:
  #   docker compose --env-file .env.production run --rm migrate npx tsx prisma/seed.ts
  migrate:
    # Pulled, not built, when APP_IMAGE_MIGRATE is set — which is what the
    # deploy pipeline does. The `build:` block stays so a build on the box is
    # still possible, but it is the fallback now, not the normal path: this VPS
    # takes the better part of an hour to build and CI takes two minutes.
    image: ${APP_IMAGE_MIGRATE:-mmpraise-migrate:local}
    build:
      context: .
      target: build
    env_file: .env.production
    command: npx prisma migrate deploy
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy

  app:
    image: ${APP_IMAGE:-mmpraise-app:local}
    build:
      context: .
      # NEXT_PUBLIC_* values are compiled into the browser bundle, so they must
      # be known at build time, not just at run time. `--env-file
      # .env.production` supplies them here; `env_file` below supplies the
      # server-side ones at run time. One file, both stages.
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_EVENT_EDITION: ${NEXT_PUBLIC_EVENT_EDITION}
        NEXT_PUBLIC_EVENT_DURATION_HOURS: ${NEXT_PUBLIC_EVENT_DURATION_HOURS}
        NEXT_PUBLIC_EVENT_STARTS_AT: ${NEXT_PUBLIC_EVENT_STARTS_AT}
        NEXT_PUBLIC_EVENT_ENDS_AT: ${NEXT_PUBLIC_EVENT_ENDS_AT}
        NEXT_PUBLIC_EVENT_NATIONS: ${NEXT_PUBLIC_EVENT_NATIONS}
        NEXT_PUBLIC_EVENT_THEME: ${NEXT_PUBLIC_EVENT_THEME}
        NEXT_PUBLIC_EVENT_VENUE: ${NEXT_PUBLIC_EVENT_VENUE}
        NEXT_PUBLIC_EVENT_VENUE_ADDRESS: ${NEXT_PUBLIC_EVENT_VENUE_ADDRESS}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL}
        NEXT_PUBLIC_CONTACT_PHONE: ${NEXT_PUBLIC_CONTACT_PHONE}
        NEXT_PUBLIC_CONTACT_ADDRESS: ${NEXT_PUBLIC_CONTACT_ADDRESS}
        NEXT_PUBLIC_FACEBOOK_URL: ${NEXT_PUBLIC_FACEBOOK_URL}
        NEXT_PUBLIC_INSTAGRAM_URL: ${NEXT_PUBLIC_INSTAGRAM_URL}
        NEXT_PUBLIC_X_URL: ${NEXT_PUBLIC_X_URL}
        NEXT_PUBLIC_TIKTOK_URL: ${NEXT_PUBLIC_TIKTOK_URL}
        NEXT_PUBLIC_FEATURE_GIVE: ${NEXT_PUBLIC_FEATURE_GIVE}
        NEXT_PUBLIC_FEATURE_ABOUT: ${NEXT_PUBLIC_FEATURE_ABOUT}
        NEXT_PUBLIC_FEATURE_BLOG: ${NEXT_PUBLIC_FEATURE_BLOG}
        NEXT_PUBLIC_FEATURE_GALLERY: ${NEXT_PUBLIC_FEATURE_GALLERY}
        NEXT_PUBLIC_FEATURE_MAGAZINE: ${NEXT_PUBLIC_FEATURE_MAGAZINE}
        NEXT_PUBLIC_FEATURE_RADIO: ${NEXT_PUBLIC_FEATURE_RADIO}
        NEXT_PUBLIC_FEATURE_PRAYER_REQUEST: ${NEXT_PUBLIC_FEATURE_PRAYER_REQUEST}
        NEXT_PUBLIC_FEATURE_CONTACT: ${NEXT_PUBLIC_FEATURE_CONTACT}
        NEXT_PUBLIC_FEATURE_LIVESTREAM: ${NEXT_PUBLIC_FEATURE_LIVESTREAM}
        NEXT_PUBLIC_FEATURE_SHARE_TESTIMONY: ${NEXT_PUBLIC_FEATURE_SHARE_TESTIMONY}
        NEXT_PUBLIC_FEATURE_NEWSLETTER: ${NEXT_PUBLIC_FEATURE_NEWSLETTER}
        NEXT_PUBLIC_REGISTRATION_URL: ${NEXT_PUBLIC_REGISTRATION_URL}
        NEXT_PUBLIC_VOLUNTEER_URL: ${NEXT_PUBLIC_VOLUNTEER_URL}
        NEXT_PUBLIC_ABOUT_URL: ${NEXT_PUBLIC_ABOUT_URL}
        NEXT_PUBLIC_DONATION_URL: ${NEXT_PUBLIC_DONATION_URL}
        NEXT_PUBLIC_LIVESTREAM_URL: ${NEXT_PUBLIC_LIVESTREAM_URL}
        NEXT_PUBLIC_YOUTUBE_URL: ${NEXT_PUBLIC_YOUTUBE_URL}
        NEXT_PUBLIC_BLOG_URL: ${NEXT_PUBLIC_BLOG_URL}
        NEXT_PUBLIC_GALLERY_URL: ${NEXT_PUBLIC_GALLERY_URL}
        NEXT_PUBLIC_PRAYER_REQUEST_URL: ${NEXT_PUBLIC_PRAYER_REQUEST_URL}
        NEXT_PUBLIC_CONTACT_URL: ${NEXT_PUBLIC_CONTACT_URL}
        NEXT_PUBLIC_RADIO_URL: ${NEXT_PUBLIC_RADIO_URL}
        NEXT_PUBLIC_MAGAZINE_URL: ${NEXT_PUBLIC_MAGAZINE_URL}
        NEXT_PUBLIC_VISIT_ADDRESS: ${NEXT_PUBLIC_VISIT_ADDRESS}
        NEXT_PUBLIC_VISIT_MAP_URL: ${NEXT_PUBLIC_VISIT_MAP_URL}
    env_file: .env.production
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    # Not published to the host: only Caddy may reach the app, so the port
    # cannot be hit directly on the VPS's public IP, bypassing TLS.
    expose:
      - '3000'
    volumes:
      # Only used if STORAGE_DRIVER=local. With STORAGE_DRIVER=s3 it stays empty
      # but costs nothing, and it keeps development mail output somewhere real.
      - uploads:/app/storage
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

  caddy:
    # Only for a box where this stack owns ports 80 and 443.
    #
    # Behind a shared reverse proxy it must not start at all: it collides on
    # port 80 and takes the whole deploy down with it. That is not
    # hypothetical — it happened on 2026-09-16, when the first pipeline deploy
    # tried to start this alongside the proxy that actually fronts the site.
    #
    #   docker compose --profile standalone up -d
    #
    # brings it back for a self-contained deployment.
    profiles: ['standalone']
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      # Used by the Caddyfile to request the certificate for the right name.
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.production}
    depends_on:
      - app
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

  # Deliberately not exposed to the host: only the other services on this
  # compose network can reach it, so the database is never on the public IP.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mmp_registration
      POSTGRES_USER: mmp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mmp -d mmp_registration']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

volumes:
  uploads:
  caddy_data:
  caddy_config:
  pgdata:
